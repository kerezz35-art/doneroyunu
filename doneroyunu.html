<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Usta Döner</title>
<style>
:root{--bg:#f3ead9;--panel:#fff8ea;--ink:#2a2118;--btn:#e8a33d;--b2:#fff;--line:#c9b48a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14172b;--panel:#1f2440;--ink:#f4ecd8;--b2:#2d345c;--line:#3b4478}}
:root[data-theme="dark"]{--bg:#14172b;--panel:#1f2440;--ink:#f4ecd8;--b2:#2d345c;--line:#3b4478}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:1000px;position:relative}
#hud{display:flex;justify-content:space-between;padding:8px 12px;font-weight:700;font-size:20px}
canvas{width:100%;display:block;image-rendering:pixelated;touch-action:none;border:2px solid var(--line)}
#bar{display:flex;gap:8px;padding:8px;align-items:stretch;background:var(--panel)}
#mid{flex:1;display:flex;flex-direction:column;gap:6px}
#hint{font-size:13px;opacity:.85;min-height:32px}
#acts{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--b2);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;cursor:pointer}
button.on,button.go{background:var(--btn);color:#2a2118}
.arr{width:56px;font-size:22px;user-select:none;touch-action:none}
#over{position:absolute;inset:0;background:rgba(10,10,25,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center}
#over[hidden]{display:none}
#menu{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;color:#fff}
#menu h1{margin:0 0 8px;font-size:clamp(30px,8vw,56px);text-shadow:0 3px 0 #000}
#menu input{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);width:min(300px,80vw);text-align:center;margin:3px 0}
#menu button{min-width:min(300px,80vw);font-size:20px;margin:4px 0}
#menu[hidden],#menu [hidden]{display:none}
#menu small{display:block;max-width:300px;margin:6px auto 0;opacity:.85}
#st{min-height:20px;font-size:14px;color:#ffe27a;max-width:320px;margin:auto}
#menu textarea{width:min(320px,80vw);font-size:12px;border-radius:8px;margin:3px 0}
html,body,#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#acts button{flex:1 1 calc(50% - 6px);min-height:54px;font-size:17px}
.arr{width:76px;min-height:76px;font-size:30px;align-self:center}

#shop{position:absolute;left:0;right:0;top:50px;display:flex;justify-content:center;z-index:6;pointer-events:none}
#shop[hidden]{display:none}
.sh{pointer-events:auto;position:relative;margin:clamp(22px,4vw,40px) 10px 0;width:min(760px,100%);box-sizing:border-box;background:#8a5a30;border:4px solid #4a2a14;border-radius:10px;padding:12px 10px 10px;box-shadow:0 6px 0 #2a160a,inset 0 0 0 3px #d9a84a;color:#3a2210}
.shT{position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;background:#4a2a18;border:3px solid #e0a840;border-radius:8px;padding:4px 18px;color:#ffcf3a;font:900 clamp(14px,3.6vw,24px)/1.15 system-ui,sans-serif;letter-spacing:.04em;text-shadow:0 2px 0 #7a3a10}
#shX{position:absolute;right:-10px;top:-16px;width:42px;min-height:42px;height:42px;padding:0;background:#d83a2a;border:3px solid #ffd27a;color:#fff;font-size:22px;border-radius:8px;line-height:1;box-shadow:0 3px 0 #7a1d12}
.shM{text-align:center;color:#fff3c8;font-weight:800;margin:10px 0 8px;font-size:17px}
#shCards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.shC{background:#fbe8c0;border:3px solid #e8c586;border-radius:8px;padding:6px 5px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;color:#3a2210}
.shC b{font-size:clamp(12px,2.6vw,16px)}
.shC .ic{height:64px;max-width:100%;object-fit:contain;image-rendering:pixelated}
.shC small{font-size:11px;line-height:1.25;opacity:.9;min-height:28px}
.shC .lv{font-weight:800;font-size:13px}
.shC .pr{display:flex;align-items:center;gap:4px;font-weight:900;font-size:17px}
.shC .pr img{height:20px;image-rendering:pixelated}
.shC button{width:100%;background:#3da83a;border:3px solid #1f6b21;color:#fff;font-size:24px;font-weight:900;min-height:38px;padding:0;border-radius:7px;box-shadow:0 3px 0 #1f6b21;line-height:1}
.shC button:disabled{background:#9aa5a5;border-color:#667;box-shadow:none;opacity:.7;cursor:default}
@media(max-width:600px){#shCards{grid-template-columns:repeat(2,1fr)}.shC .ic{height:52px}}

#menu{overflow-y:auto;justify-content:safe center}
@media (orientation:landscape) and (max-height:620px){
 html,body{height:100%;overflow:hidden}
 body{display:block}
 #app{position:fixed;left:0;top:0;right:0;bottom:0;max-width:none;width:auto}
 #hud{position:absolute;left:0;right:0;top:0;z-index:3;padding:2px max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));font-size:15px;pointer-events:none;color:#fff;text-shadow:0 2px 0 #000;align-items:center}
 #hud button{pointer-events:auto;min-height:28px;padding:1px 9px}
 canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100dvh*16/9));height:auto;border:0}
 #bar{position:absolute;left:0;top:0;right:0;bottom:0;padding:0;background:transparent;pointer-events:none;display:block}
 #bar .arr{pointer-events:auto;position:absolute;bottom:max(8px,env(safe-area-inset-bottom));width:84px;min-height:64px;height:64px;font-size:26px;opacity:.6;z-index:3}
 #L{left:max(10px,env(safe-area-inset-left))}
 #R{right:max(10px,env(safe-area-inset-right))}
 #mid{position:absolute;left:50%;top:calc(50% - min(100dvh,56.25vw)*.34);transform:translateX(-50%);width:min(100vw,177.7dvh);max-width:min(100vw,177.7dvh);padding:0 90px;box-sizing:border-box;pointer-events:none;z-index:2}
 #hint{display:none}
 #acts{justify-content:center;gap:5px}
 #acts button{pointer-events:auto;flex:0 1 auto;min-height:38px;font-size:14px;padding:3px 10px;opacity:.9}
 #shop{top:0;bottom:0;align-items:center}
 .sh{margin:22px 10px 0}
 .shC .ic{height:44px}
 .shC small{font-size:10px;min-height:0}
 .shM{margin:8px 0 6px}
 #menu{padding:6px;gap:3px}
 #menu h1{font-size:clamp(24px,9vh,40px);margin:0 0 2px}
 #menu button{font-size:17px;margin:2px 0;min-height:38px}
 #menu small{margin:2px auto 0}
}
</style></head><body>
<div id="app">
<div id="hud"><span id="sc"></span><span><button id="bMenu" style="min-height:32px;padding:2px 10px">☰</button> <small id="ppl"></small> <small id="dayi" style="font-weight:800"></small></span><span id="lv"></span></div>
<canvas id="c" width="1280" height="720"></canvas>
<div id="bar"><button class="arr" id="L">◀</button><div id="mid"><div id="hint"></div><div id="acts"></div></div><button class="arr" id="R">▶</button></div>
<div id="shop" hidden><div class="sh"><div class="shT">DÜKKÂN GELİŞTİRME</div><button id="shX" aria-label="Kapat">✕</button><div class="shM" id="shM"></div><div id="shCards"></div></div></div>
<div id="over" hidden><h2>Dükkan battı! 😵</h2><div id="fin" style="font-size:22px"></div><button class="go" id="again">Tekrar oyna</button><button id="bOver">Menüye dön</button></div>
<div id="menu"><h1>🌯 USTA DÖNER</h1>
<div id="main"><button class="go" id="bSolo">▶ OYNA</button><br><button id="bOn">🌐 ONLINE</button><br><button id="bFs">⛶ Tam ekran / Yatay</button></div>
<div id="onl" hidden><input id="nm" maxlength="12" placeholder="Usta adı"><br><input id="rp" inputmode="numeric" maxlength="4" placeholder="Katılmak için 4 haneli kod"><br><button class="go" id="bMk">Oda Kur</button><br><button id="bJn">Katıl</button><br><button id="bCod">🔗 Kodla bağlan (Claude’suz)</button><br><button id="bBk">← Geri</button><div id="st"></div><small>Oda Kur’a basınca oyun sana 4 haneli bir kod verir. Arkadaşın kodu yazıp Katıl’a basar, aynı dükkanda çalışırsınız.</small></div><div id="cod" hidden><input id="nm2" maxlength="12" placeholder="Usta adı"><br>
<button id="cHost" class="go">Oda kur</button><br><button id="cJoin">Katıl</button><br>
<div id="ch" hidden><small>1) Bu kodu arkadaşına gönder:</small><textarea id="o1" readonly rows="3"></textarea><small>2) Onun cevap kodunu yapıştır:</small><textarea id="a1" rows="3"></textarea><br><button id="bAns">Bağlan</button><br><button id="bPlus">+ Arkadaş daha</button><br><button class="go" id="bStart">▶ Oyuna başla</button></div>
<div id="cg" hidden><small>Davet kodunu yapıştır:</small><textarea id="o2" rows="3"></textarea><br><button id="bAn">Cevap kodu üret</button><br><small>Bu kodu odayı kuran kişiye gönder:</small><textarea id="a2" readonly rows="3"></textarea></div>
<button id="cBk">← Geri</button><div id="cs" style="color:#ffe27a;font-size:14px;max-width:320px;margin:auto"></div></div>
<div id="msg" style="color:#ffe27a;min-height:20px"></div></div>
</div>

 const used=S.cs.map(c=>c.s),free=SEATS.map((_,i)=>i).filter(i=>!used.includes(i));

 S.cs.push({id:++S.nid,s:i,x:st.x,by:st.by,dine,it,box:dine?'tabak':'paket',st:'wait',m:100,tw:false,ti:9+Math.random()*6,e:0,v:Math.random()*2|0,dn:grp||0,sk:rnd(SK),sh:grp==1?S.dk.gs:rnd(SH),hr:rnd(HR)});say(S.cs[S.cs.length-1]);

 if(!a.st){a.st='idle';a.t=1}a.id=i+1;a.mv=0;
 const mv=tx=>{const dx=tx-a.x;if(Math.abs(dx)<6)return true;a.d=Math.sign(dx);a.x+=a.d*Math.min(Math.abs(dx),SP*dt);a.mv=1;return false};
 const find=job=>job=='tea'?S.cs.filter(c=>c.tw&&!c.apc&&c.st!='gone').sort((x,y)=>x.m-y.m)[0]:S.cs.filter(c=>c.st=='wait'&&!c.apc&&c.m<=88).sort((x,y)=>x.m-y.m)[0];
 const cur=()=>{const c=S.cs.find(z=>z.id==a.tg);return c&&c.st!='gone'&&(a.job=='tea'?c.tw:c.st=='wait')?c:null};
 const drop=()=>{const c=S.cs.find(z=>z.id==a.tg);if(c&&c.apc==a.id)c.apc=0;a.cy=0;a.st='idle';a.t=1};
 if(a.st=='idle'){a.t-=dt;if(a.t>0){mv(250+170*i);return}

 else if(a.st=='go'){if(!cur()){drop();return}if(mv(a.job=='tea'?1190:555)){a.st='work';a.t=a.job=='tea'?1.2:2.4}}

async function go(mk){
 const nm=nameOk($('nm').value)||'Usta',st=$('st');
 let code=$('rp').value.replace(/\D/g,'');
 if(!mk&&code.length!=4){st.textContent='Arkadaşının verdiği 4 haneli kodu yaz.';return}
 st.textContent='Bağlanılıyor…';
 let R=null;try{R=typeof claude!='undefined'?await claude.use('room'):null}catch(e){}
 if(!R)return peerGo(mk,code,nm);
 let room=null;
 for(let k=0;k<(mk?4:1)&&!room;k++){
  if(mk)code=String(1000+Math.random()*9000|0);
  let rm;try{rm=await R.join('k'+code)}catch(e){st.textContent='Odaya girilemedi, tekrar dene.';return}
  rm.presence({n:nm}).catch(()=>{});
  await new Promise(r=>setTimeout(r,1500));
  const others=rm.peers().filter(p=>!p.isMe&&p.kind=='viewer').length;
  if(mk&&others){rm.leave();continue}
  if(!mk&&!others){st.textContent='Bu kodla bir oda yok. Kod doğru mu? Önce arkadaşın Oda Kur demeli.';rm.leave();return}
  room=rm}
 if(!room){st.textContent='Oda kurulamadı, tekrar dene.';return}
 net={room,name:nm,code,host:false,aq:0,acts:[],seen:{},rp:{},pt:0,lastEv:null};
 reset();run=true;$('menu').hidden=true;
}
let PR=null;
function loadPeer(){return new Promise((ok,no)=>{if(window.Peer)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=ok;s.onerror=()=>no(Error('PeerJS yüklenemedi'));document.head.appendChild(s)})}
const wrapC=c=>({get readyState(){return c.open?'open':'closed'},send:s=>c.send(s)});
async function peerGo(mk,code,nm){
 const st=$('st');st.textContent='Bağlanılıyor…';
 try{await loadPeer()}catch(e){st.textContent='Online servis yüklenemedi (internet var mı?). Bu sayfa dış bağlantıya izin vermiyorsa dosya sürümünü kullan.';return}
 if(PR){try{PR.destroy()}catch(e){}PR=null}
 if(mk){
  for(let k=0;k<4;k++){
   const c4=String(1000+Math.random()*9000|0);
   const res=await new Promise(done=>{
    const P=new Peer('dnr'+c4);let opened=0;
    P.on('open',()=>{opened=1;PR=P;const A=mkHost(),lv=A.leave;A.leave=()=>{try{P.destroy()}catch(e){}return lv()};
     P.on('connection',c=>{const id='b'+(++A.n),cc=A.conns[id]={pc:{close:()=>{try{c.close()}catch(e){}}},dc:wrapC(c),ok:false,pr:null};
      c.on('open',()=>{cc.ok=true;c.send(JSON.stringify({t:'w',id}))});
      c.on('data',d=>{try{const m=JSON.parse(d);if(m.t=='p')cc.pr=m.d}catch(e){}});
      c.on('close',()=>{delete A.conns[id]})});
     done({A,code:c4})});
    P.on('error',e=>{if(!opened){try{P.destroy()}catch(_){}done({err:e.type})}})});
   if(res.A){begin(res.A,nm);net.code=res.code;return}
   if(res.err!='unavailable-id'){st.textContent='Sunucuya bağlanılamadı ('+res.err+'). İnternet var mı?';return}
  }
  st.textContent='Oda kurulamadı, tekrar dene.';return}
 await new Promise(done=>{
  const P=new Peer();PR=P;let ok=0;
  const A={dead:false,id:'g0',tb:[],my:{},dc:null,
   peers(){return[{peer:A.id,isMe:true,sameTab:true,kind:'viewer',presence:A.my}].concat(A.tb.filter(q=>q.peer!=A.id).map(q=>({peer:q.peer,isMe:false,sameTab:false,kind:'viewer',presence:q.presence||{}})))},
   presence(p){A.my=p;if(A.dc&&A.dc.readyState=='open')A.dc.send(JSON.stringify({t:'p',d:p}));return Promise.resolve()},
   leave(){try{P.destroy()}catch(e){}A.dead=true;return Promise.resolve()}};
  const tm=setTimeout(()=>{if(!ok){st.textContent='Bağlanılamadı. Kod doğru mu, oda açık mı?';try{P.destroy()}catch(e){}done()}},12000);
  P.on('open',()=>{const c=P.connect('dnr'+code,{reliable:true});A.dc=wrapC(c);
   c.on('open',()=>{ok=1;clearTimeout(tm);begin(A,nm);net.code=code;done()});
   c.on('data',d=>{try{const m=JSON.parse(d);if(m.t=='w')A.id=m.id;else if(m.t=='t')A.tb=m.p}catch(e){}});
   c.on('close',()=>{A.dead=true})});
  P.on('error',e=>{if(ok)return;clearTimeout(tm);st.textContent=e.type=='peer-unavailable'?'Bu kodla oda yok. Kod doğru mu, kuran açık mı?':'Bağlantı hatası: '+e.type;try{P.destroy()}catch(_){}done()})});
}

function mkHost(){
 const A={dead:false,n:0,conns:{},my:{},onJoin:null,
  peers(){return[{peer:'a0',isMe:true,sameTab:true,kind:'viewer',presence:A.my}].concat(Object.entries(A.conns).filter(([k,c])=>c.ok).map(([k,c])=>({peer:k,isMe:false,sameTab:false,kind:'viewer',presence:c.pr||{}})))},
